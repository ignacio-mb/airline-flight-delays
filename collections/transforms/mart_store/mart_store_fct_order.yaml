description: 'One row per: order (historical Sample data and orders added in the Store Admin app) Key: order_id Sources: public.orders, public.people, store_analytics.cfg_store Definition: each order with its amounts, net sales, discount share, the customer''s order number, first/repeat flags, cohort month, months since first order, days since the previous order, origin, and period completeness Caveats: Source quirks kept and flagged (T11): 67 orders with quantity 0 (is_zero_quantity, $6,015 revenue) and 1 with discount above subtotal (is_discount_over_subtotal). total_usd is the recorded total (Revenue, D2); total_recomputed_usd = subtotal + tax - discount. Net sales = subtotal - discount (T4). Order number is by ordered_at then order_id (T5). Cohort = first-order month (T3). T6: April 2020 (data ends 2020-04-19) and the current month are flagged incomplete but kept. order_origin = app after cfg_store.historical_end_at  Owner: ignacio@metabase.com.'
