name: New customers
description: 'Self-consistent only, no external reference. People who signed up in the period, by signup date (2,500 all time). 18% of orders predate their customer''s signup, so for new buyers by first order use New buyers. Refreshed every 10 minutes from the store transforms, so orders added in the Store Admin app appear within about 10 minutes. April 2020 (data ends 2020-04-19) and the current month are partial and shown, flagged on Store orders. Owner: ignacio@metabase.com.'
