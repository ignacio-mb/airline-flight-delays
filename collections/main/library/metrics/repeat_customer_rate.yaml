name: Repeat customer rate
description: 'Self-consistent only, no external reference. Share of buyers with 2+ lifetime orders, by cohort (first-order) month (94.9% of buyers overall). Recent cohorts read low until they have had time to reorder. Refreshed every 10 minutes from the store transforms, so orders added in the Store Admin app appear within about 10 minutes. April 2020 (data ends 2020-04-19) and the current month are partial and shown, flagged on Store orders. Owner: ignacio@metabase.com.'
