name: Customers ordering
description: 'Self-consistent only, no external reference. Distinct customers with at least one order in the period (1,747 have ever ordered). Not additive across months. Refreshed every 10 minutes from the store transforms, so orders added in the Store Admin app appear within about 10 minutes. April 2020 (data ends 2020-04-19) and the current month are partial and shown, flagged on Store orders. Owner: ignacio@metabase.com.'
