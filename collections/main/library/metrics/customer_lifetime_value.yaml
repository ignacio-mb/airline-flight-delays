name: Customer lifetime value
description: 'Self-consistent only, no external reference. Average lifetime revenue per buyer in USD, by cohort (first-order) month. Customers who never ordered are excluded. Older cohorts have had longer to spend. Refreshed every 10 minutes from the store transforms, so orders added in the Store Admin app appear within about 10 minutes. April 2020 (data ends 2020-04-19) and the current month are partial and shown, flagged on Store orders. Owner: ignacio@metabase.com.'
