caveats: 'On time means arriving less than 15 minutes after schedule; cancelled and diverted flights are never on time. Dates and hours are local to the departure airport. October airports are inferred from September/November flights on the same leg (1,097 October flights keep an unknown airport). Delay causes exist only for flights 15+ minutes late. US Airways (US) flew January–June only, before merging into American. Closed 2015 extract: every month is complete.'
caveats_set: true
collection_id: librarylibrarydatadat
created_at: '2026-09-30T15:37:26.338787Z'
description: One row per scheduled US domestic flight in 2015 (5,819,079 flights across 14 airlines), including the 89,884 cancelled and 15,187 diverted. Each flight has its local scheduled date and hour, IATA airports, a status (on time, late, cancelled, diverted), and delays and delay causes in minutes.
description_set: true
display_name: Flights
